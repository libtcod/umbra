name: CMake

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

env:
  project-name: umbra-demo
  # Build mode for CMake, such as "Release" or "Debug".
  BUILD_TYPE: Release
  # Indicates the location of the vcpkg as a Git submodule of the project repository.
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-2025
            triplet: x64-windows
            platform-name: windows.x64
          - os: macos-15
            triplet: arm64-osx
            platform-name: macos.arm64
          - os: ubuntu-24.04
            triplet: x64-linux
            platform-name: linux.x64
            # libltdl-dev needed to build libxcrypt sub-dependency, others needed for sdl3
            apt-packages: libltdl-dev libx11-dev libxft-dev libxext-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libibus-1.0-dev

    steps:
      - name: Install APT packages
        if: matrix.apt-packages
        run: sudo apt-get update && sudo apt-get install ${{ matrix.apt-packages }}
      # fetch-depth=0 and v1 are needed for 'git describe' to work correctly.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true
      # Setup the build machine with the most recent versions of CMake and Ninja. Both are cached if not already: on subsequent runs both will be quickly restored from GitHub cache service.
      - uses: lukka/get-cmake@latest
      - name: Restore vcpkg and its artifacts
        uses: actions/cache@v5
        with:
          # The first path is where vcpkg generates artifacts while consuming the vcpkg.json manifest file.
          # The second path is the location of vcpkg (it contains the vcpkg executable and data files).
          # The other paths starting with '!' are exclusions: they contain temporary files generated during the build of the installed packages.
          path: |
            build/vcpkg_installed/
            ${{ env.VCPKG_ROOT }}
            !${{ env.VCPKG_ROOT }}/buildtrees
            !${{ env.VCPKG_ROOT }}/packages
            !${{ env.VCPKG_ROOT }}/downloads
          # The key is composed in a way that it gets properly invalidated: this must happen whenever vcpkg's Git commit id changes, or the list of packages changes. In this case a cache miss must happen and a new entry with a new key with be pushed to GitHub the cache service.
          # The key includes: hash of the vcpkg.json file, the hash of the vcpkg Git commit id, and the used vcpkg's triplet. The vcpkg's commit id would suffice, but computing an hash out it does not harm.
          # Note: given a key, the cache content is immutable. If a cache entry has been created improperly, in order the recreate the right content the key must be changed as well, and it must be brand new (i.e. not existing already).
          key: ${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', '.git/modules/vcpkg/HEAD') }}
      # On Windows runners, let's ensure to have the Developer Command Prompt environment setup correctly. As used here the Developer Command Prompt created is targeting x64 and using the default the Windows SDK.
      - uses: ilammy/msvc-dev-cmd@v1
      # Run CMake to generate Ninja project files, using the vcpkg's toolchain file to resolve and install the dependencies as specified in vcpkg.json.
      - name: Install dependencies and generate project files
        run: cmake
          -S "${{ github.workspace }}"
          -B build
          -G Ninja
          -D VCPKG_TARGET_TRIPLET="${{ matrix.triplet }}"
          -D CMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}"
          -D UMBRA_DEMO=ON
          -D UMBRA_CPACK=ON
      # Build the whole project with Ninja (which is spawn by CMake).
      - name: Build
        run: cmake --build build
      - name: Show contents of the build directory
        run: find build
      # Copy files from the CMake build and data directory into a new distribution folder.
      - name: CPack
        run: cpack --verbose --config build/CPackConfig.cmake -B dist -R `git describe --always`
      # Upload archives as artifacts, these can be downloaded from the GitHub Actions page.
      - name: "Upload Artifact"
        uses: actions/upload-artifact@v6
        with:
          name: automated-builds-${{ matrix.triplet }}
          path: dist/*.*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      # If a tag is pushed then a new archives are uploaded to GitHub Releases automatically.
      - name: Upload release
        if: github.ref_type == 'tag'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*.*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
